# Targets and controls are only used for labeling/visualization, data parsing treats them identically
target_drugs:
  - "SEMAGLUTIDE"
control_drugs:
  - "PHENTERMINE"
  - "METFORMIN"
  - "RIMEGEPANT"
  - "LIRAGLUTIDE"
  - "TIRZEPATIDE"
  - "DULAGLUTIDE"

# Injectable GLP-1/GIP comparators (also listed in control_drugs), used for the same-class interaction model
glp1_comparators:
  - "LIRAGLUTIDE"
  - "TIRZEPATIDE"
  - "DULAGLUTIDE"

# Generic name first, then brand names; QSYMIA is left out because it is phentermine/topiramate
drug_mappings:
  SEMAGLUTIDE:
    - "SEMAGLUTIDE"
    - "OZEMPIC"
    - "WEGOVY"
    - "RYBELSUS"
  PHENTERMINE:
